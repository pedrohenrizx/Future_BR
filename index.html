<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campanha Flávio Bonsonaro - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://npmcdn.com/parse/dist/parse.min.js"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-green-700">Flávio Bonsonaro</h1>
            <p class="text-gray-600 mt-2">Apoie a campanha e conecte-se!</p>
        </div>

        <!-- Login Form -->
        <div id="login-section">
            <h2 class="text-xl font-semibold mb-4">Entrar</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700">Usuário</label>
                    <input type="text" id="login-username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div>
                    <label class="block text-gray-700">Senha</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition duration-200">Entrar</button>
            </form>
            <div class="mt-4 text-center">
                <p class="text-sm text-gray-600">Não tem uma conta? <button onclick="toggleForms()" class="text-green-600 font-semibold hover:underline">Cadastre-se</button></p>
            </div>
            <div id="login-error" class="mt-4 text-red-500 text-sm hidden text-center"></div>
        </div>

        <!-- Registration Form -->
        <div id="register-section" class="hidden">
            <h2 class="text-xl font-semibold mb-4">Cadastrar</h2>
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-gray-700">Usuário</label>
                    <input type="text" id="register-username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div>
                    <label class="block text-gray-700">Email</label>
                    <input type="email" id="register-email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div>
                    <label class="block text-gray-700">Senha</label>
                    <input type="password" id="register-password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <button type="submit" class="w-full bg-yellow-500 text-white py-2 rounded-lg hover:bg-yellow-600 transition duration-200">Cadastrar</button>
            </form>
            <div class="mt-4 text-center">
                <p class="text-sm text-gray-600">Já tem uma conta? <button onclick="toggleForms()" class="text-green-600 font-semibold hover:underline">Entrar</button></p>
            </div>
            <div id="register-error" class="mt-4 text-red-500 text-sm hidden text-center"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function toggleForms() {
            document.getElementById('login-section').classList.toggle('hidden');
            document.getElementById('register-section').classList.toggle('hidden');
        }
    </script>
</body>
</html>
