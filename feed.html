<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed da Campanha - Flávio Bonsonaro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/pt-br.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Navigation -->
    <nav class="bg-green-700 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center max-w-4xl">
            <h1 class="text-2xl font-bold">Flávio Bonsonaro - A Rede</h1>
            <div class="flex items-center space-x-4">
                <span id="welcome-message" class="font-medium"></span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded transition duration-200">Sair</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto mt-8 px-4 max-w-3xl">

        <!-- Post Creation Form -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">Apoie a campanha</h2>
            <form id="post-form">
                <textarea id="post-content" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 resize-none h-24" placeholder="O que você tem a dizer sobre a campanha?" required></textarea>
                <div class="mt-4 flex justify-end">
                    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition duration-200 font-medium">Publicar</button>
                </div>
                <div id="post-error" class="mt-2 text-red-500 text-sm hidden"></div>
            </form>
        </div>

        <!-- Feed Stream -->
        <div id="feed-stream" class="space-y-6">
            <!-- Posts will be injected here dynamically -->
            <div id="loading-spinner" class="text-center py-4 text-gray-500">
                <svg class="animate-spin h-8 w-8 mx-auto text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="mt-2">Carregando feed...</p>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof checkAuth === 'function') {
                checkAuth();
            }
        });
    </script>
</body>
</html>
